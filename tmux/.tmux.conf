# Use Ctrl+a as the tmux prefix; press it twice to pass Ctrl+a through.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support (scroll wheel, click to select pane/window, drag to resize)
set -g mouse on

# Auto-renumber windows when one closes (no gaps)
set -g renumber-windows on

# Bigger scrollback
set -g history-limit 10000

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ctrl + mouse wheel switches windows, with a transient toast listing all
# windows (current one highlighted) that auto-clears after display-time.
# A modal display-popup would swallow the next wheel tick, so use the
# non-blocking status message instead.
set -g display-time 1200
bind -n C-WheelUpPane   previous-window \; display-message '#{W: #I:#W ,#[reverse] #I:#W #[noreverse]}'
bind -n C-WheelDownPane next-window     \; display-message '#{W: #I:#W ,#[reverse] #I:#W #[noreverse]}'
# gnome-terminal eats Ctrl+wheel for font zoom, so also switch on plain wheel
# over the status bar (which it does forward).
bind -n WheelUpStatus   previous-window \; display-message '#{W: #I:#W ,#[reverse] #I:#W #[noreverse]}'
bind -n WheelDownStatus next-window     \; display-message '#{W: #I:#W ,#[reverse] #I:#W #[noreverse]}'
# Restore tmux's normal pane click and kill a window with status middle-click.
bind -n MouseDown1Pane  select-pane -t= \; send-keys -M
bind -n MouseDown2Status kill-window

# Copy copy-mode selections to the desktop clipboard instead of only tmux's
# internal paste buffer. Stay in copy mode after copying so the pane keeps its
# current scroll position instead of jumping back to the live bottom.
set -g set-clipboard on
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -in -selection clipboard"
bind -T copy-mode    M-w               send-keys -X copy-pipe "xclip -in -selection clipboard"
bind -T copy-mode-vi y                 send-keys -X copy-pipe "xclip -in -selection clipboard"
bind -T root DoubleClick1Pane select-pane -t= \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe "xclip -in -selection clipboard" }
bind -T root TripleClick1Pane select-pane -t= \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe "xclip -in -selection clipboard" }
bind -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe "xclip -in -selection clipboard"
bind -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe "xclip -in -selection clipboard"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe "xclip -in -selection clipboard"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe "xclip -in -selection clipboard"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sandudorogan/tmux-pane-tree'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @treemux-tree-client 'nvim-tree'
set -g @treemux-tree-nvim-init-file '~/.tmux/plugins/treemux/configs/treemux_init.lua'
set -g @treemux-nvim-command 'NVIM_APPNAME=nvim-treemux nvim'
set -g @treemux-tree 'e'
set -g @treemux-python-command "$HOME/.local/share/treemux/venv/bin/python"
set -g @treemux-refresh-interval-inactive-window 5
set -g @plugin 'kiyoon/treemux'

# Keep tmux-thumbs selections in both tmux's buffer and the X11 clipboard.
set -g @thumbs-command 'tmux set-buffer -- "{}" && printf %s "{}" | xclip -in -selection clipboard && tmux display-message "Copied to tmux and system clipboard"'
set -g @thumbs-upcase-command 'tmux set-buffer -- "{}" && printf %s "{}" | xclip -in -selection clipboard && tmux paste-buffer && tmux display-message "Copied, pasted, and sent to system clipboard"'
set -g @thumbs-multi-command 'tmux set-buffer -- "{}" && printf %s "{}" | xclip -in -selection clipboard && tmux paste-buffer && tmux display-message "Copied multiple items to tmux and system clipboard"'

# Show pane title + current git branch at the top of each pane
set -g pane-border-status top
# Refresh the border (git branch/dirty) every 2s instead of the 15s default
set -g status-interval 2

# Pane border styling: heavy unicode lines, dim inactive, bright active
set -g pane-border-lines heavy
set -g pane-border-indicators colour
set -g pane-border-style        'fg=colour240'
set -g pane-active-border-style 'fg=colour39,bold'
# Dim the title text on inactive panes; brighten/bold on the active one
set -g pane-border-format '#[align=left] #{?pane_active,#[fg=colour231#,bg=colour54#,bold],#[fg=colour250#,bg=colour238]} #P · #{pane_title} #[default] #{?pane_active,#[bg=colour22],#[bg=colour237]}#($HOME/.tmux/git-segment.sh "#{pane_current_path}" #{?pane_active,1,0})#[default]#{?window_zoomed_flag, #[fg=colour16#,bg=colour208#,bold] FULLSCREEN #[default],}'

# Horizontal tmux window bar.
set -g status on
setw -g window-status-format         '#[fg=colour16] #I:#W#{?window_flags,#{window_flags}, } #[default]'
setw -g window-status-current-format '#[fg=colour231,bg=colour237,bold] #I:#W#{?window_flags,#{window_flags}, } #[default]'
setw -g window-status-separator      ' '

# resurrect: capture pane contents and restore common programs
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh vim nvim "~vim->vim *" "~nvim->nvim *" less more man tail top htop btop irssi weechat mutt'

# continuum: auto-save every 15 minutes, auto-restore on tmux server start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux
run '~/.tmux/plugins/tpm/tpm'
